<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>OMRON IQ & ECG Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: a 3:4 portrait frame (about 900 x 1200) so the page can sit inside another page.
   Logo and title, the campaign timeline with its runrate marker, then one section at a time:
   Overall, KPI & Budget, Detail. Plain white ground, one deep blue for data; channel names
   wear their platform colour; status colours only on status marks. */
:root{
  color-scheme:light;
  --page:#ffffff; --ink:#0b1a2b; --ink-2:#4a5a6a; --muted:#8a96a3;
  --grid:#e6ebf0; --axis:#c5ced8; --border:#dfe5ec; --wash:#f3f6f9;
  --fill:#005eb8; --track:#d6e6f6; --on-fill:#ffffff;
  --good:#188a41; --warn:#d98200; --crit:#c8372d; --idle:#8a96a3;
  --font:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4}
.wrap{max-width:900px;aspect-ratio:3/4;margin:0 auto;padding-inline:20px;padding-block:20px 28px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}
h1{font-size:34px;font-weight:700;letter-spacing:-.015em;line-height:1.1;text-wrap:balance}
h2{font-size:18px;font-weight:700}
h3{font-size:14px;font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.ch{font-weight:700}

/* header */
.head{display:flex;flex-direction:column;gap:8px}
.brand{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;min-width:0}
.head-title{display:flex;flex-direction:column;gap:3px;min-width:0}
.logo{width:120px;height:48px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--axis);border-radius:6px;color:var(--muted);font-size:12px;flex:none}
.logo.has{border:0}
.logo img{max-width:100%;max-height:100%;object-fit:contain}
.timeline{display:flex;flex-direction:column;gap:6px}
.tl-label{position:relative;height:38px}
.tl-label div{position:absolute;bottom:2px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;line-height:1.15;white-space:nowrap}
.tl-label span{font-size:11.5px;color:var(--ink-2);font-weight:500}
.tl-label strong{font-size:20px;font-weight:700;color:var(--fill)}
.tl-bar{position:relative;height:10px;border-radius:5px;background:var(--track)}
.tl-fill{position:absolute;inset:0 auto 0 0;background:var(--fill);border-radius:5px 0 0 5px}
.tl-now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.tl-months{display:grid;font-size:11.5px;color:var(--ink-2)}
.tl-months span{border-left:1px solid var(--axis);padding-left:5px;white-space:nowrap;overflow:hidden}

/* section switch */
.tabrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.stamp{font-size:12px;color:var(--ink-2)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--wash);border-radius:10px;padding:4px;max-width:100%}
.tabs button{font:inherit;font-weight:500;color:var(--ink-2);background:transparent;border:1px solid transparent;border-radius:7px;padding:7px 16px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--fill);color:var(--on-fill);border-color:var(--fill)}
.tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

/* shared */
.section{display:flex;flex-direction:column;gap:24px;min-width:0}
.block{display:flex;flex-direction:column;gap:10px;min-width:0}
.block-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.card{background:var(--page);border:1px solid var(--border);border-radius:10px;padding:18px;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);align-items:center}
.sw{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.sw.plan{background:var(--track)} .sw.used{background:var(--fill)}
.sw.now{width:2px;height:12px;background:var(--ink);border-radius:0}
.meter{position:relative;height:10px;border-radius:5px;background:var(--track)}
.meter-fill{position:absolute;inset:0 auto 0 0;background:var(--fill);border-radius:5px}
.meter-mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap}
.status i{width:9px;height:9px;border-radius:50%;flex:none}
.status.on i{background:var(--good)} .status.risk i{background:var(--warn)} .status.behind i{background:var(--crit)} .status.none i{background:var(--idle)}

/* overall */
.spend{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px 28px;align-items:center;padding:22px}
@media (max-width:640px){.spend{grid-template-columns:minmax(0,1fr)}}
.spend-main{display:flex;flex-direction:column;gap:10px}
.spend-pct{font-size:64px;font-weight:700;line-height:1;letter-spacing:-.02em}
.pair{display:flex;flex-direction:column;gap:12px}
.pair div{display:flex;flex-direction:column}
.pair .k{font-size:13px;color:var(--ink-2)}
.pair .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{display:flex;flex-direction:column;gap:8px;padding:18px 16px}
.kpi-name{font-size:14px;font-weight:500;color:var(--ink)}
.kpi-name .ch{display:block;font-size:12.5px}
.kpi-pct{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em}
.kpi-of{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.impact{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:760px){.impact{grid-template-columns:repeat(2,minmax(0,1fr))}}
.impact .card{display:flex;flex-direction:column;gap:8px;padding:26px 14px}
.impact .k{font-size:14px;color:var(--ink-2);font-weight:500}
.impact .v{font-size:38px;font-weight:700;line-height:1;letter-spacing:-.02em}

/* tables */
.tablebox{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--page)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--grid);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th{font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody td:first-child{white-space:nowrap}
td .l2{display:block;font-size:12.5px}
td .l3{display:block;color:var(--ink-2);font-size:12px}
tfoot td{font-weight:700;border-top:1px solid var(--axis);border-bottom:0}
.pc{display:flex;flex-direction:column;gap:4px;align-items:flex-end;min-width:86px}
.pc strong{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.cellbar{height:6px;border-radius:3px;background:var(--track);position:relative;width:100%}
.cellbar b{position:absolute;inset:0 auto 0 0;background:var(--fill);border-radius:3px}
.cellbar i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

/* budget by month */
.chart{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 6px}
.yaxis{position:relative;height:162px;font-size:11px;color:var(--ink-2)}
.yaxis span{position:absolute;right:0;transform:translateY(50%);white-space:nowrap}
.plot{position:relative;height:162px;border-bottom:1px solid var(--axis)}
.gridline{position:absolute;left:0;right:0;height:1px;background:var(--grid)}
.cols{position:absolute;inset:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;cursor:default;outline:0}
.col .cap{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.col .bar{position:relative;width:24px;max-width:70%;background:var(--track);border-radius:4px 4px 0 0}
.col .usedbar{position:absolute;left:0;right:0;bottom:0;background:var(--fill);border-radius:4px 4px 0 0}
.col:hover .bar,.col:focus-visible .bar{filter:brightness(.94)}
.col:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.xaxis{grid-column:2;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);font-size:11.5px;color:var(--ink-2);text-align:center;padding-top:6px}

/* detail sheet */
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);font-weight:500}
.filters select{font:inherit;font-size:13px;color:var(--ink);background:var(--page);border:1px solid var(--axis);border-radius:7px;padding:6px 9px;min-width:118px}
.filters select:focus-visible,.btn:focus-visible{outline:2px solid var(--fill);outline-offset:1px}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--on-fill);background:var(--fill);border:1px solid var(--fill);border-radius:7px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.filters .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.filters .note{font-size:12px;color:var(--ink-2)}
.sheetbox{max-height:760px;overflow:auto}
.sheet{font-size:12.5px;border-collapse:separate;border-spacing:0}
.sheet th,.sheet td{padding:6px 10px;white-space:nowrap;border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);background:var(--page)}
.sheet th:last-child,.sheet td:last-child{border-right:0}
.sheet thead th{position:sticky;top:0;z-index:2;background:var(--wash);color:var(--ink);font-weight:700;font-size:12px;border-bottom:1px solid var(--axis)}
.sheet .fz{position:sticky;left:0;z-index:1}
.sheet .fz2{left:var(--fz1,0px);border-right:2px solid var(--axis)}
.sheet thead th.fz{z-index:3}
.sheet td.strong{font-weight:700}
.sheet a{color:var(--fill);text-underline-offset:2px}
.sheet .empty td{text-align:center;color:var(--ink-2);padding:24px}
#tip{position:fixed;z-index:10;pointer-events:none;background:var(--ink);color:var(--on-fill);border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.5;max-width:260px;box-shadow:0 4px 14px rgba(11,26,43,.2)}
#tip b{display:block;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="brand">
      <div class="logo" id="logoClient"></div>
      <div class="head-title">
        <span class="eyebrow">Digital campaign report</span>
        <h1 id="campaignName"></h1>
      </div>
    </div>
    <div class="timeline" aria-label="Campaign timeline">
      <div class="tl-label"><div id="tlLabel"><span>Project runrate</span><strong id="tlPct"></strong></div></div>
      <div class="tl-bar"><div class="tl-fill" id="tlFill"></div><div class="tl-now" id="tlNow"></div></div>
      <div class="tl-months" id="tlMonths"></div>
    </div>
  </header>

  <div class="tabrow">
  <nav class="tabs" role="tablist" aria-label="Dashboard sections" id="tabs">
    <button type="button" role="tab" id="tab-overall" data-panel="overall" aria-selected="true">Overall</button>
    <button type="button" role="tab" id="tab-kpi" data-panel="kpi" aria-selected="false">KPI &amp; Budget</button>
    <button type="button" role="tab" id="tab-detail" data-panel="detail" aria-selected="false">Detail</button>
  </nav>
  <span class="stamp" id="stamp" aria-live="polite"></span>
  </div>

  <section class="section" id="panel-overall" role="tabpanel" aria-labelledby="tab-overall">
    <div class="block">
      <div class="block-head"><h2>Spending progress</h2><span class="legend"><span><span class="sw used"></span>Used</span><span><span class="sw plan"></span>Budget</span><span><span class="sw now"></span>Project runrate</span></span></div>
      <div class="card spend">
        <div class="spend-main"><div class="spend-pct" id="spendPct"></div><div class="meter" id="spendMeter"></div></div>
        <div class="pair">
          <div><span class="k">Used</span><span class="v" id="spendUsed"></span></div>
          <div><span class="k">Remaining budget</span><span class="v" id="spendLeft"></span></div>
        </div>
      </div>
    </div>
    <div class="block">
      <div class="block-head"><h2>KPI achieved</h2><span class="legend"><span><span class="sw used"></span>Achieved</span><span><span class="sw plan"></span>Committed</span><span><span class="sw now"></span>Project runrate</span></span></div>
      <div class="kpis" id="kpis"></div>
    </div>
    <div class="block">
      <div class="block-head"><h2>Total Impact on Brand</h2></div>
      <div class="impact" id="impact"></div>
    </div>
  </section>

  <section class="section" id="panel-kpi" role="tabpanel" aria-labelledby="tab-kpi" hidden>
    <div class="block">
      <div class="block-head"><h2>KPI</h2><span class="legend"><span><span class="sw used"></span>Achieved</span><span><span class="sw plan"></span>Committed</span><span><span class="sw now"></span>Project runrate</span></span></div>
      <div class="tablebox"><table id="kpiTable"></table></div>
    </div>
    <div class="block">
      <div class="block-head"><h2>Budget</h2></div>
      <div class="tablebox"><table id="budTable"></table></div>
    </div>
    <div class="block">
      <div class="block-head"><h2>Budget by month</h2><span class="legend"><span><span class="sw used"></span>Used</span><span><span class="sw plan"></span>Planned</span></span></div>
      <div class="card">
        <div class="chart">
          <div class="yaxis" id="yaxis"></div>
          <div class="plot" id="plot"><div class="cols" id="cols"></div></div>
          <div class="xaxis" id="xaxis"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="panel-detail" role="tabpanel" aria-labelledby="tab-detail" hidden>
    <div class="filters">
      <label for="fMonth">Month<select id="fMonth"></select></label>
      <label for="fProduct">Product<select id="fProduct"></select></label>
      <label for="fChannel">Channel<select id="fChannel"></select></label>
      <label for="fBuy">Buying Type<select id="fBuy"></select></label>
      <label for="fStatus">Status<select id="fStatus"></select></label>
      <span class="right"><span class="note" id="xNote" aria-live="polite"></span><button type="button" class="btn" id="xBtn">Export Excel</button></span>
    </div>
    <div class="tablebox sheetbox"><table id="sheet" class="sheet"></table></div>
  </section>
</div>
<div id="tip" hidden></div>

<script id="model">
/* ---------- settings ---------- */
// status thresholds: progress as a share of the project runrate, in percent
const PACE = { onTrack: 95, atRisk: 80 };
const STATUS_LABEL = { on: 'On track', risk: 'At risk', behind: 'Behind plan', none: 'Not started' };
const KPI_NAME = { 'Impression': 'Impressions', 'Click': 'Clicks', 'Thruplay': 'ThruPlays', 'View 2s': '2-second views' };
const CHANNEL_COLOR = { 'Facebook': '#1877F2', 'TikTok': '#000000' };
const TYPE_ORDER = ['Social post', 'HCP', 'Cut Video'];
const BUY_ORDER = ['Click', 'Impression', 'Thruplay', 'View 2s'];

/* ---------- formulas ---------- */
const num = v => typeof v === 'number' ? v : (Number(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')) || 0);
function monthKey(v) { // accepts 09/2026 or 2026-09
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{1,2})\/(\d{4})$/))) return m[2] + '-' + m[1].padStart(2, '0');
  if ((m = s.match(/^(\d{4})-(\d{1,2})/))) return m[1] + '-' + m[2].padStart(2, '0');
  return s;
}
function dayNumber(iso) { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; }
function monthsBetween(start, end) {
  const out = []; let [y, m] = start.split('-').map(Number); const [ey, em] = end.split('-').map(Number);
  while (y < ey || (y === ey && m <= em)) { out.push(y + '-' + String(m).padStart(2, '0')); if (++m > 12) { m = 1; y++; } }
  return out;
}
function paceStatus(pct, run, started) {
  if (!started) return 'none';
  const pace = run ? pct / run * 100 : 0;
  return pace >= PACE.onTrack ? 'on' : pace >= PACE.atRisk ? 'risk' : 'behind';
}
function buildModel(DATA) {
  const col = name => DATA.columns.indexOf(name);
  const C = { month: col('Month'), product: col('Product'), channel: col('Channel'), buy: col('Buying Type'), format: col('Format'), type: col('Type'),
    post: col('Post #'), plan: col('Plan KPI'), results: col('Results'), impr: col('Impr'), reach: col('Reach'), clicks: col('Clicks (All)'),
    link: col('Link Clicks'), views: col('Views'), eng: col('Engagements') };
  // committed KPI and budget per channel and buying type; unit rate = budget / KPI
  const lines = DATA.kpi.map(([channel, buy, kpi, budget]) => ({ channel, buy, plan: num(kpi), budget: num(budget), rate: num(budget) / num(kpi), results: 0, used: 0, rowPlan: 0 }));
  const lineOf = {}; lines.forEach(l => { lineOf[l.buy] = l; });
  const buys = lines.map(l => l.buy);
  const months = monthsBetween(DATA.campaign.start.slice(0, 7), DATA.campaign.end.slice(0, 7));
  const totalDays = dayNumber(DATA.campaign.end) - dayNumber(DATA.campaign.start) + 1;
  const elapsedDays = Math.max(0, Math.min(totalDays, dayNumber(DATA.campaign.asOf) - dayNumber(DATA.campaign.start) + 1));
  const run = elapsedDays / totalDays * 100;
  // post links: the link of the same buying type first, otherwise the post's only link
  const linkExact = {}, linkAny = {};
  (DATA.links || []).forEach(([type, post, buy, url]) => {
    const p = (String(post).match(/\d+/) || [''])[0];
    if (buy) linkExact[type + '|' + p + '|' + buy] = url;
    (linkAny[type + '|' + p] = linkAny[type + '|' + p] || new Set()).add(url);
  });

  // one row per post and buying type: its ad sets (audiences) added together
  const byKey = new Map();
  for (const a of DATA.rows) {
    const postNo = (String(a[C.post]).match(/\d+/) || [''])[0];
    const rec = { month: monthKey(a[C.month]), product: a[C.product], channel: a[C.channel], buy: a[C.buy], format: a[C.format], type: a[C.type], post: postNo };
    const key = [rec.month, rec.product, rec.channel, rec.buy, rec.format, rec.type, rec.post].join('|');
    let r = byKey.get(key);
    if (!r) { r = Object.assign(rec, { label: String(a[C.post]), plan: 0, results: 0, impr: 0, reach: 0, clicks: 0, link: 0, views: 0, eng: 0, used: 0 }); byKey.set(key, r); }
    const plan = num(a[C.plan]), results = num(a[C.results]), rate = lineOf[rec.buy] ? lineOf[rec.buy].rate : 0;
    if (String(a[C.post]).length > r.label.length) r.label = String(a[C.post]);   // keep the fuller label, whatever the row order
    r.plan += plan; r.results += results; r.impr += num(a[C.impr]); r.reach += num(a[C.reach]); r.clicks += num(a[C.clicks]);
    r.link += num(a[C.link]); r.views += num(a[C.views]); r.eng += num(a[C.eng]);
    r.used += Math.min(results, plan) * rate;            // budget used: delivered KPI x unit rate, capped at the plan of each ad set
  }
  const rows = Array.from(byKey.values());
  const m = { campaign: DATA.campaign, rows, months, buys, lines, lineOf, totalDays, elapsedDays, elapsedPct: run,
    byMonth: {}, budget: 0, used: 0, impr: 0, clicks: 0, eng: 0, reach: 0, views: 0 };
  for (const mo of months) m.byMonth[mo] = { budget: 0, used: 0 };
  for (const r of rows) {
    r.name = r.type + ' · ' + r.format + ' ' + r.label;
    r.pct = r.plan ? r.results / r.plan * 100 : 0;                         // %KPI Achieve
    r.fre = r.reach ? r.impr / r.reach : null;                              // frequency
    r.status = r.results === 0 ? 'none' : r.pct >= 100 ? 'met' : 'below';
    r.budget = r.plan * (lineOf[r.buy] ? lineOf[r.buy].rate : 0);           // planned budget of the row
    const any = linkAny[r.type + '|' + r.post];
    r.link_url = linkExact[r.type + '|' + r.post + '|' + r.buy] || (r.channel === 'Facebook' && any && any.size === 1 ? Array.from(any)[0] : '') || '';
    const L = lineOf[r.buy], M = m.byMonth[r.month];
    if (L) { L.results += r.results; L.used += r.used; L.rowPlan += r.plan; }
    if (M) { M.budget += r.budget; M.used += r.used; }
    m.used += r.used; m.impr += r.impr; m.clicks += r.clicks; m.eng += r.eng; m.reach += r.reach; m.views += r.views;
  }
  for (const l of lines) {
    m.budget += l.budget;
    l.pct = l.plan ? l.results / l.plan * 100 : 0;                          // % achieved
    l.status = paceStatus(l.pct, run, l.results > 0);                       // against the project runrate
    l.usedPct = l.budget ? l.used / l.budget * 100 : 0;
  }
  m.spendPct = m.budget ? m.used / m.budget * 100 : 0;
  rows.sort((a, b) => a.month.localeCompare(b.month) || TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type) ||
    Number(a.post) - Number(b.post) || a.channel.localeCompare(b.channel) || BUY_ORDER.indexOf(a.buy) - BUY_ORDER.indexOf(b.buy));
  return m;
}

/* ---------- Excel export: a minimal .xlsx (one sheet, stored zip) ---------- */
function crc32(u8) {
  let crc = ~0;
  for (let i = 0; i < u8.length; i++) { let c = (crc ^ u8[i]) & 0xff; for (let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1; crc = (crc >>> 8) ^ c; }
  return ~crc >>> 0;
}
function zipStore(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(12, 0x21, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(14, 0x21, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const csize = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, csize, true); end.setUint32(16, offset, true);
  return [...parts, ...central, new Uint8Array(end.buffer)];
}
function xlsxParts(header, body) {
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const cell = v => typeof v === 'number' ? '<c><v>' + v + '</v></c>' : '<c t="inlineStr"><is><t xml:space="preserve">' + esc(v) + '</t></is></c>';
  const sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>' +
    [header].concat(body).map(r => '<row>' + r.map(cell).join('') + '</row>').join('') + '</sheetData></worksheet>';
  return zipStore([
    { name: '[Content_Types].xml', text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>' },
    { name: '_rels/.rels', text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { name: 'xl/workbook.xml', text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Detail" sheetId="1" r:id="rId1"/></sheets></workbook>' },
    { name: 'xl/_rels/workbook.xml.rels', text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>' },
    { name: 'xl/worksheets/sheet1.xml', text: sheet }
  ]);
}
if (typeof module !== 'undefined') module.exports = { buildModel, xlsxParts };
</script>

<script>
(function () {
  /* Logo image link. Paste a link between the quotes; an empty slot shows a placeholder box. */
  const LOGO = { client: '' };   // OMRON logo
  /* Live data. Paste the Apps Script web app link (ends in /exec) between the quotes.
     Left empty, the page shows the data block built into this file. */
  const DATA_URL = '';

  const wrap = document.querySelector('.wrap'), SHELL = wrap.innerHTML;
  let currentTab = (location.hash || '').slice(1) || 'overall';

  function render(DATA, stamp) {
  const M = buildModel(DATA);
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const int = n => Math.round(n).toLocaleString('en-US');
  const pct = (n, d = 1) => n.toFixed(d) + '%';
  const ratio = (a, b) => b ? a / b * 100 : 0;
  const vndM = n => n === 0 ? '0' : (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  const vndCap = n => Math.round(n / 1e6) + 'M';
  const dong = n => int(n) + 'đ';
  const compact = n => n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : int(n);
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthName = (mo, long) => { const [y, m] = mo.split('-').map(Number);
    return long ? MON[m - 1] + ' ' + y : MON[m - 1] + (m === 1 || mo === M.months[0] ? " '" + String(y).slice(2) : ''); };
  const RUN = M.elapsedPct;
  const kpiName = b => KPI_NAME[b] || b;
  const channelTag = (name, cls) => { const s = el('span', 'ch ' + (cls || ''), name); s.style.color = CHANNEL_COLOR[name] || 'inherit'; return s; };

  /* header */
  $('campaignName').textContent = DATA.campaign.name;
  (function () {
    const box = $('logoClient'); box.textContent = 'OMRON logo';
    if (!LOGO.client) return;
    const img = new Image(); img.alt = 'OMRON';
    img.onload = () => { box.textContent = ''; box.classList.add('has'); box.appendChild(img); };
    img.src = LOGO.client;
  })();
  $('tlFill').style.width = RUN + '%';
  $('tlNow').style.left = 'calc(' + RUN + '% - 1px)';
  $('tlLabel').style.left = 'clamp(48px, ' + RUN + '%, calc(100% - 48px))';
  $('tlPct').textContent = pct(RUN);
  const daysIn = M.months.map(mo => { const [y, m] = mo.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); });
  $('tlMonths').style.gridTemplateColumns = daysIn.map(d => d + 'fr').join(' ');
  M.months.forEach(mo => $('tlMonths').appendChild(el('span', null, monthName(mo))));

  /* small pieces */
  const tip = $('tip');
  function bindTip(node, title, lines) {
    const show = () => {
      tip.textContent = ''; tip.appendChild(el('b', null, title));
      for (const l of lines) tip.appendChild(el('div', null, l));
      tip.hidden = false;
      const r = node.getBoundingClientRect(), t = tip.getBoundingClientRect();
      let x = r.left + r.width / 2 - t.width / 2; x = Math.max(8, Math.min(x, window.innerWidth - t.width - 8));
      let y = r.top - t.height - 8; if (y < 8) y = r.bottom + 8;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    };
    const hide = () => { tip.hidden = true; };
    node.addEventListener('pointerenter', show); node.addEventListener('pointerleave', hide);
    node.addEventListener('focus', show); node.addEventListener('blur', hide);
  }
  function fillMeter(m, p, mark) {
    m.textContent = ''; const f = el('div', 'meter-fill'); f.style.width = Math.min(100, p) + '%'; m.appendChild(f);
    if (mark != null) { const k = el('div', 'meter-mark'); k.style.left = 'calc(' + mark + '% - 1px)'; m.appendChild(k); }
    return m;
  }
  function statusChip(code) { const s = el('span', 'status ' + code); s.appendChild(el('i')); s.appendChild(document.createTextNode(STATUS_LABEL[code])); return s; }
  function pctCell(cell, p) {
    const box = el('div', 'pc'); box.appendChild(el('strong', null, pct(p)));
    const cb = el('div', 'cellbar'), f = el('b'); f.style.width = Math.min(100, p) + '%'; cb.appendChild(f);
    const k = el('i'); k.style.left = 'calc(' + RUN + '% - 1px)'; cb.appendChild(k);
    box.appendChild(cb); cell.appendChild(box);
  }

  /* section switch */
  const onShow = {};
  const selectTab = (function () {
    const buttons = Array.from($('tabs').querySelectorAll('button'));
    const select = name => {
      if (!buttons.some(b => b.dataset.panel === name)) return false;
      buttons.forEach(b => { const on = b.dataset.panel === name; b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1; $('panel-' + b.dataset.panel).hidden = !on; });
      currentTab = name; tip.hidden = true; if (onShow[name]) onShow[name](); return true;
    };
    buttons.forEach((b, i) => {
      b.addEventListener('click', () => select(b.dataset.panel));
      b.addEventListener('keydown', ev => {
        if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
        const n = buttons[(i + (ev.key === 'ArrowRight' ? 1 : buttons.length - 1)) % buttons.length];
        select(n.dataset.panel); n.focus(); ev.preventDefault();
      });
    });
    return select;
  })();

  /* ---------- Overall ---------- */
  $('spendPct').textContent = pct(M.spendPct);
  fillMeter($('spendMeter'), M.spendPct, RUN);
  $('spendUsed').textContent = vndM(M.used) + ' of ' + vndM(M.budget);
  $('spendLeft').textContent = vndM(M.budget - M.used);
  for (const k of M.lines) {
    const a = el('article', 'card kpi');
    const n = el('div', 'kpi-name', kpiName(k.buy)); n.appendChild(channelTag(k.channel)); a.appendChild(n);
    a.appendChild(el('div', 'kpi-pct', pct(k.pct)));
    a.appendChild(fillMeter(el('div', 'meter'), k.pct, RUN));
    a.appendChild(el('div', 'kpi-of', int(k.results) + ' of ' + int(k.plan)));
    a.appendChild(statusChip(k.status));
    $('kpis').appendChild(a);
  }
  [['Impressions', M.impr], ['Cumulative reach', M.reach], ['Views', M.views], ['Engagements', M.eng], ['Clicks', M.clicks]].forEach(([k, v]) => {
    const d = el('div', 'card'); d.appendChild(el('span', 'k', k)); d.appendChild(el('span', 'v', compact(v))); $('impact').appendChild(d);
  });

  /* ---------- KPI & Budget ---------- */
  (function () {
    const nameCell = (cell, l) => { cell.textContent = kpiName(l.buy); cell.appendChild(channelTag(l.channel, 'l2')); };
    const t = $('kpiTable'), hr = t.createTHead().insertRow();
    [['KPI', ''], ['Committed', 'r'], ['Achieved', 'r'], ['Remaining', 'r'], ['% achieved', 'r'], ['Status', '']].forEach(([h, c]) => hr.appendChild(el('th', c, h)));
    const tb = t.createTBody();
    for (const k of M.lines) {
      const r = tb.insertRow();
      nameCell(r.insertCell(), k);
      [int(k.plan), int(k.results), int(Math.max(0, k.plan - k.results))].forEach(v => { const x = r.insertCell(); x.className = 'r'; x.textContent = v; });
      pctCell(r.insertCell(), k.pct);
      r.insertCell().appendChild(statusChip(k.status));
    }
    const b = $('budTable'), bh = b.createTHead().insertRow();
    [['KPI', ''], ['Budget', 'r'], ['Used', 'r'], ['Remaining', 'r'], ['% used', 'r']].forEach(([h, c]) => bh.appendChild(el('th', c, h)));
    const bb = b.createTBody();
    for (const k of M.lines) {
      const r = bb.insertRow();
      nameCell(r.insertCell(), k);
      [dong(k.budget), dong(k.used), dong(k.budget - k.used)].forEach(v => { const x = r.insertCell(); x.className = 'r'; x.textContent = v; });
      pctCell(r.insertCell(), k.usedPct);
    }
    const f = b.createTFoot().insertRow();
    f.insertCell().textContent = 'Total';
    [dong(M.budget), dong(M.used), dong(M.budget - M.used)].forEach(v => { const x = f.insertCell(); x.className = 'r'; x.textContent = v; });
    pctCell(f.insertCell(), M.spendPct);
  })();

  /* budget by month: planned track with the used part filled */
  (function () {
    const peak = Math.max.apply(null, M.months.map(mo => M.byMonth[mo].budget).concat([1]));
    const step = peak > 240e6 ? 100e6 : peak > 120e6 ? 50e6 : peak > 60e6 ? 25e6 : 10e6;
    const axMax = Math.ceil(peak / step) * step * 1.14;
    for (let t = 0; t <= Math.ceil(peak / step) * step; t += step) {
      const s = el('span', null, t / 1e6 + 'M'); s.style.bottom = (t / axMax * 100) + '%'; $('yaxis').appendChild(s);
      if (t > 0) { const g = el('div', 'gridline'); g.style.bottom = (t / axMax * 100) + '%'; $('plot').insertBefore(g, $('cols')); }
    }
    for (const mo of M.months) {
      const d = M.byMonth[mo];
      const col = el('div', 'col'); col.tabIndex = 0; col.setAttribute('role', 'img');
      col.setAttribute('aria-label', monthName(mo, true) + ': planned ' + int(d.budget) + ' VND, used ' + int(d.used) + ' VND');
      col.appendChild(el('span', 'cap', vndCap(d.budget)));
      const bar = el('div', 'bar'); bar.style.height = (d.budget / axMax * 100) + '%';
      if (d.used > 0) { const u = el('div', 'usedbar'); u.style.height = Math.min(100, ratio(d.used, d.budget)) + '%'; bar.appendChild(u); }
      col.appendChild(bar);
      bindTip(col, monthName(mo, true), ['Planned ' + dong(d.budget), 'Used ' + dong(d.used) + ' (' + pct(ratio(d.used, d.budget)) + ')']);
      $('cols').appendChild(col);
      $('xaxis').appendChild(el('span', null, monthName(mo)));
    }
  })();

  /* ---------- Detail: the working sheet ---------- */
  (function () {
    const ROW_STATUS = { met: 'KPI met', below: 'Below KPI', none: 'Not started' };
    const rows = M.rows;
    // [header, cell class, text for the page, value for Excel]
    const COLS = [
      ['Month', 'fz', r => monthName(r.month, true)], ['Post name', 'fz fz2', r => r.name],
      ['Product', '', r => r.product], ['Channel', '', r => r.channel], ['Buying Type', '', r => r.buy], ['Link', 'link', r => r.link_url],
      ['Plan KPI', 'r', r => int(r.plan), r => r.plan], ['%KPI Achieve', 'r strong heat', r => pct(r.pct), r => Math.round(r.pct * 10) / 10], ['Results', 'r', r => int(r.results), r => r.results],
      ['Impr', 'r', r => int(r.impr), r => r.impr], ['Reach', 'r', r => int(r.reach), r => r.reach], ['Fre', 'r', r => r.fre == null ? '' : r.fre.toFixed(2), r => r.fre == null ? '' : Math.round(r.fre * 100) / 100],
      ['Clicks (All)', 'r', r => int(r.clicks), r => r.clicks], ['Link Clicks', 'r', r => int(r.link), r => r.link], ['Views', 'r', r => int(r.views), r => r.views], ['Engagements', 'r', r => int(r.eng), r => r.eng]
    ];
    const t = $('sheet'), hr = t.createTHead().insertRow();
    COLS.forEach(([h, c]) => hr.appendChild(el('th', c.replace(/ strong| heat|link/g, ''), h)));
    const tb = t.createTBody();
    const fill = (sel, allLabel, values, labelOf) => { sel.appendChild(new Option(allLabel, '')); values.forEach(v => sel.appendChild(new Option(labelOf ? labelOf(v) : v, v))); };
    const uniq = key => Array.from(new Set(rows.map(r => r[key])));
    fill($('fMonth'), 'All months', M.months, mo => monthName(mo, true));
    fill($('fProduct'), 'All products', uniq('product'));
    fill($('fChannel'), 'All channels', uniq('channel'));
    fill($('fBuy'), 'All buying types', BUY_ORDER.filter(b => rows.some(r => r.buy === b)).concat(uniq('buy').filter(b => BUY_ORDER.indexOf(b) < 0)));
    fill($('fStatus'), 'All statuses', Object.keys(ROW_STATUS), k => ROW_STATUS[k]);

    /* %KPI colour: blue deepens toward 100%, green at 100%, darker green from 110% */
    const LIGHT = [226, 238, 250], DEEP = [0, 94, 184], INK = [11, 26, 43], WHITE = [255, 255, 255];
    const lum = c => { const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };
    const contrast = (a, b) => { const p = lum(a), q = lum(b); return (Math.max(p, q) + 0.05) / (Math.min(p, q) + 0.05); };
    function heat(td, p) {
      if (!(p > 0)) return;
      const bg = p >= 110 ? [15, 107, 49] : p >= 100 ? [24, 138, 65] : LIGHT.map((v, i) => Math.round(v + (DEEP[i] - v) * Math.max(0, Math.min(1, p / 100))));
      const fg = contrast(bg, WHITE) >= contrast(bg, INK) ? WHITE : INK;
      td.style.background = 'rgb(' + bg.join(',') + ')'; td.style.color = 'rgb(' + fg.join(',') + ')';
    }
    let shown = rows;
    function freeze() { const first = t.querySelector('thead th'); if (first) t.style.setProperty('--fz1', first.getBoundingClientRect().width + 'px'); }
    function render() {
      const f = { month: $('fMonth').value, product: $('fProduct').value, channel: $('fChannel').value, buy: $('fBuy').value, status: $('fStatus').value };
      shown = rows.filter(r => Object.keys(f).every(k => !f[k] || r[k] === f[k]));
      tb.textContent = '';
      for (const r of shown) {
        const tr = tb.insertRow();
        COLS.forEach(([, c, get]) => {
          const td = tr.insertCell(), v = get(r);
          if (c === 'link') { if (v) { const a = el('a', null, 'View post'); a.href = v; a.target = '_blank'; a.rel = 'noopener'; td.appendChild(a); } return; }
          td.className = c.replace(' heat', ''); td.textContent = v; if (c.indexOf('heat') >= 0) heat(td, r.pct);
        });
      }
      if (!shown.length) { const tr = tb.insertRow(); tr.className = 'empty'; const td = tr.insertCell(); td.colSpan = COLS.length; td.textContent = 'No rows match these filters'; }
      freeze();
    }
    ['fMonth', 'fProduct', 'fChannel', 'fBuy', 'fStatus'].forEach(id => $(id).addEventListener('change', render));
    render();
    onShow.detail = freeze;

    /* export the rows currently shown */
    const note = $('xNote');
    $('xBtn').addEventListener('click', async () => {
      const header = COLS.map(c => c[0] === '%KPI Achieve' ? '%KPI Achieve (%)' : c[0]);
      const body = shown.map(r => COLS.map(c => (c[3] || c[2])(r)));
      const blob = new Blob(xlsxParts(header, body), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const filename = 'IQ-ECG-campaign-detail.xlsx';
      note.textContent = '';
      if (window.claude && window.claude.use) {
        let dl = null;
        try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
        if (!dl) { note.textContent = 'Export is not available in this view'; return; }
        try { await dl.save({ filename, data: blob }); note.textContent = shown.length + ' rows exported'; }
        catch (e) { note.textContent = e && e.code === 'declined' ? '' : e && e.code === 'rate_limited' ? 'A save prompt is already open' : 'Export is not available in this view'; }
        return;
      }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      note.textContent = shown.length + ' rows exported';
    });
  })();

  selectTab(currentTab) || selectTab('overall');
  $('stamp').textContent = stamp || '';
  }

  const EMBEDDED = JSON.parse(document.getElementById('data').textContent);
  render(EMBEDDED, DATA_URL ? 'Loading live data' : '');
  if (DATA_URL) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
    fetch(DATA_URL, { signal: ctl.signal }).then(r => r.json()).then(d => {
      if (!d || d.error || !d.campaign || !Array.isArray(d.columns) || !Array.isArray(d.rows) || !Array.isArray(d.kpi)) throw new Error((d && d.error) || 'Unexpected data');
      wrap.innerHTML = SHELL; render(d, 'Live data, updated ' + (d.updated || d.campaign.asOf));
    }).catch(err => {
      wrap.innerHTML = SHELL; render(EMBEDDED, 'Live data unavailable (' + (err && err.message || 'no answer') + '). Showing the snapshot of ' + EMBEDDED.campaign.asOf);
    }).finally(() => clearTimeout(timer));
  }
})();
</script>
